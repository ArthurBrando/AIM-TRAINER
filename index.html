<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AIM TRAINER</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#090909;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:17px;font-weight:900;letter-spacing:3px}
.logo span{color:#e32636}
.stats{display:flex;gap:8px}
.stat{background:#111d;border:1px solid #444;padding:8px 12px;border-radius:7px;font-size:11px}
.stat b{display:block;font-size:17px;margin-top:3px}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:white}
#crosshair:before{width:2px;height:24px;left:11px}
#crosshair:after{height:2px;width:24px;top:11px}
#hitmarker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;color:#e32636;opacity:0}
#bottom{position:absolute;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}
.control{pointer-events:auto;border:1px solid #555;background:#171717dd;color:white;border-radius:50%;width:62px;height:62px;font-weight:bold;font-size:11px;display:flex;align-items:center;justify-content:center;user-select:none}
.control:active{background:#e32636}
#fire{width:82px;height:82px;background:#c51e2d;border:2px solid white;font-size:14px}
#fire svg{width:32px;height:32px;fill:white}
.cluster{display:flex;gap:9px;align-items:center}
#joystick{width:105px;height:105px;border-radius:50%;border:1px solid #777;background:#1119;position:relative;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:42px;height:42px;left:31px;top:31px;border-radius:50%;background:#ddd;border:3px solid #333}
#ammo{position:absolute;right:20px;bottom:112px;font-size:22px;font-weight:bold}
#ammo small{font-size:11px;color:#aaa}
#reload{position:absolute;right:110px;bottom:24px}
#menu{position:absolute;top:75px;left:14px;pointer-events:auto}
select,button{background:#171717;color:white;border:1px solid #555;padding:10px;border-radius:6px}
#start{position:absolute;inset:0;background:#090909;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;z-index:5}
#start h1{font-size:36px;letter-spacing:5px;margin:0}
#start h1 span{color:#e32636}
#start p{color:#aaa;font-size:12px;text-align:center;max-width:280px;line-height:1.6}
#start button{background:#c51e2d;border:0;padding:15px 38px;font-weight:bold;letter-spacing:2px}
#notice{position:absolute;top:43%;width:100%;text-align:center;font-weight:bold;color:#e32636;opacity:0}
@media(max-width:600px){.stats .stat{padding:6px 8px}.stat b{font-size:14px}#menu{top:70px}.control{width:55px;height:55px}#fire{width:76px;height:76px}}
</style>
</head>
<body>

<div id="start">
<h1>AIM <span>TRAINER</span></h1>
<p>Treine sua precisão, velocidade e reflexos.<br>Seu modelo 3D será carregado automaticamente.</p>
<button id="startBtn">INICIAR TREINAMENTO</button>
<div id="loadStatus" style="font-size:11px;color:#999">AGUARDANDO INICIALIZAÇÃO</div>
</div>

<div id="hud">
<div class="top">
<div class="logo">AIM<span>.</span>TRAINER</div>
<div class="stats">
<div class="stat">PONTOS<b id="score">0000</b></div>
<div class="stat">ACERTOS<b id="hits">0</b></div>
<div class="stat">TEMPO<b id="time">60</b></div>
</div>
</div>

<div id="menu">
<select id="mode">
<option value="grid">GRID SHOT</option>
<option value="flick">FLICK</option>
<option value="tracking">TRACKING</option>
<option value="speed">SPEED TAP</option>
<option value="precision">PRECISION</option>
<option value="sixshot">SIXSHOT</option>
</select>
</div>

<div id="crosshair"></div>
<div id="hitmarker">×</div>
<div id="notice"></div>

<div id="ammo">12 <small>/ 120</small></div>

<div id="bottom">
<div id="joystick"><div id="stick"></div></div>
<div class="cluster">
<div class="control" id="crouch">AGACHAR</div>
<div class="control" id="jump">PULAR</div>
<div class="control" id="aim">MIRAR</div>
<div class="control" id="reload">RECARREGAR</div>
<div class="control" id="fire">
<svg viewBox="0 0 24 24"><path d="M2 10h11l2-3h3l1 3h3v5h-5l-2 2h-3l-2-2H8v5H5v-5H2z"/></svg>
</div>
</div>
</div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const status=document.getElementById('loadStatus');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111111);
scene.fog=new THREE.Fog(0x111111,15,45);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.65,5);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x333333,2));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(3,8,5);
scene.add(light);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshStandardMaterial({color:0x242424,roughness:1})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=0;
scene.add(floor);

const grid=new THREE.GridHelper(100,50,0x555555,0x292929);
grid.position.y=.01;
scene.add(grid);

const wall=new THREE.Mesh(
 new THREE.BoxGeometry(30,12,.5),
 new THREE.MeshStandardMaterial({color:0x171717})
);
wall.position.set(0,6,-15);
scene.add(wall);

const weaponGroup=new THREE.Group();
camera.add(weaponGroup);
scene.add(camera);

let weapon=null,animations={},mixer=null;
let currentAction=null;

function playAnimation(name){
 if(!mixer || !animations[name])return;
 if(currentAction)currentAction.fadeOut(.08);
 currentAction=mixer.clipAction(animations[name]);
 currentAction.reset().fadeIn(.08).play();
}

async function loadWeapon(){
 try{
  status.textContent='CARREGANDO ARMA 3D...';
  const gltf=await new GLTFLoader().loadAsync('./arms.glb');
  weapon=gltf.scene;
  weapon.scale.setScalar(.8);
  weapon.position.set(.15,-.12,-.48);
  weapon.rotation.y=Math.PI;
  weaponGroup.add(weapon);
  mixer=new THREE.AnimationMixer(weapon);
  gltf.animations.forEach(clip=>animations[clip.name]=clip);
  playAnimation('Armature|Idle');
  status.textContent='ARMA 3D CARREGADA';
 }catch(e){
  console.error(e);
  status.textContent='ARMS.GLB NÃO ENCONTRADO — VERIFIQUE O ARQUIVO';
 }
}

const targets=[];
const targetMaterial=new THREE.MeshStandardMaterial({color:0xe32636,roughness:.4});
const targetRingMaterial=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5});

function createTarget(x,y,z){
 const group=new THREE.Group();
 const sphere=new THREE.Mesh(new THREE.SphereGeometry(.34,24,24),targetMaterial);
 group.add(sphere);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.43,.035,8,32),targetRingMaterial);
 group.add(ring);
 group.position.set(x,y,z);
 group.userData={baseX:x,baseY:y,phase:Math.random()*6};
 scene.add(group);
 targets.push(group);
 return group;
}

function resetTargets(){
 targets.forEach(t=>scene.remove(t));
 targets.length=0;
 const mode=document.getElementById('mode').value;
 let amount=mode==='sixshot'?6:mode==='precision'?3:8;
 for(let i=0;i<amount;i++){
  createTarget((Math.random()-.5)*12,1.4+Math.random()*3,-8-Math.random()*12);
 }
}

let score=0,hits=0,ammo=12,reserve=120;
let remaining=60,playing=false,lastTime=0;
let yaw=0,pitch=0,moveX=0,moveY=0;
let recoil=0,aiming=false;

function updateUI(){
 document.getElementById('score').textContent=String(score).padStart(4,'0');
 document.getElementById('hits').textContent=hits;
 document.getElementById('time').textContent=Math.ceil(remaining);
 document.getElementById('ammo').innerHTML=ammo+' <small>/ '+reserve+'</small>';
}

function showNotice(text){
 const el=document.getElementById('notice');
 el.textContent=text;
 el.style.opacity=1;
 setTimeout(()=>el.style.opacity=0,650);
}

function shoot(){
 if(!playing||ammo<=0)return;
 ammo--;
 recoil=.08;
 playAnimation('Armature|Fire');
 setTimeout(()=>playAnimation('Armature|Idle'),250);
 const ray=new THREE.Raycaster();
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const objects=targets.flatMap(t=>t.children);
 const hit=ray.intersectObjects(objects,false);
 if(hit.length){
  const target=hit[0].object.parent;
  scene.remove(target);
  targets.splice(targets.indexOf(target),1);
  score+=100;
  hits++;
  document.getElementById('hitmarker').style.opacity=1;
  setTimeout(()=>document.getElementById('hitmarker').style.opacity=0,120);
  if(targets.length<4)resetTargets();
 }else{
  score=Math.max(0,score-5);
 }
 updateUI();
}

function reload(){
 if(ammo===12||reserve<=0)return;
 playAnimation('Armature|ReloadClip');
 setTimeout(()=>{
  const amount=Math.min(12-ammo,reserve);
  ammo+=amount;
  reserve-=amount;
  updateUI();
  playAnimation('Armature|Idle');
 },1000);
}

function startGame(){
 score=0;hits=0;ammo=12;reserve=120;remaining=60;
 playing=true;
 resetTargets();
 updateUI();
 document.getElementById('start').style.display='none';
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('mode').onchange=()=>{if(playing)resetTargets()};
document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
document.getElementById('reload').addEventListener('pointerdown',e=>{e.preventDefault();reload()});

document.getElementById('aim').addEventListener('pointerdown',()=>{
 aiming=true;camera.fov=48;camera.updateProjectionMatrix();
});
document.getElementById('aim').addEventListener('pointerup',()=>{
 aiming=false;camera.fov=70;camera.updateProjectionMatrix();
});

document.getElementById('jump').addEventListener('pointerdown',()=>{
 camera.position.y=2.1;
 setTimeout(()=>camera.position.y=1.65,350);
});
document.getElementById('crouch').addEventListener('pointerdown',()=>{
 camera.position.y=camera.position.y===1.65?1.05:1.65;
});

const joy=document.getElementById('joystick');
const stick=document.getElementById('stick');
let joyActive=false;
joy.addEventListener('pointerdown',e=>{
 joyActive=true;joy.setPointerCapture(e.pointerId);moveJoy(e);
});
joy.addEventListener('pointermove',e=>{if(joyActive)moveJoy(e)});
joy.addEventListener('pointerup',()=>{
 joyActive=false;moveX=0;moveY=0;
 stick.style.transform='translate(0,0)';
});
function moveJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const max=32,dist=Math.hypot(x,y);
 if(dist>max){x=x/dist*max;y=y/dist*max}
 moveX=x/max;moveY=y/max;
 stick.style.transform=`translate(${x}px,${y}px)`;
}

let lookPointer=null,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'){
  lookPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
 }else{
  lastX=e.clientX;lastY=e.clientY;
  lookPointer=e.pointerId;
 }
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(lookPointer!==e.pointerId)return;
 const dx=e.clientX-lastX,dy=e.clientY-lastY;
 yaw-=dx*.003;
 pitch-=dy*.003;
 pitch=Math.max(-1.2,Math.min(1.2,pitch));
 lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener('pointerup',()=>lookPointer=null);
renderer.domElement.addEventListener('pointercancel',()=>lookPointer=null);

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-lastTime)/1000,.05)||0;
 lastTime=now;
 if(mixer)mixer.update(dt);

 if(playing){
  remaining-=dt;
  if(remaining<=0){
   remaining=0;playing=false;
   showNotice('TREINAMENTO FINALIZADO');
  }
  camera.rotation.set(pitch,yaw,0);
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  camera.position.addScaledVector(forward,-moveY*dt*4);
  camera.position.addScaledVector(right,moveX*dt*4);
  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-12,12);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,-12,8);

  targets.forEach(t=>{
   if(document.getElementById('mode').value==='tracking'){
    t.position.x=t.userData.baseX+Math.sin(now*.0015+t.userData.phase)*2;
   }
  });
  updateUI();
 }

 if(recoil>0){
  weaponGroup.position.z=-recoil;
  recoil=Math.max(0,recoil-dt*.5);
 }else weaponGroup.position.z=0;

 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
loadWeapon();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
